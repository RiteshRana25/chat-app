# Deploy the API from the monorepo root.
# Prefer setting Root Directory = "server" in Railway UI.
# This config is a backup if Root Directory is left as "/" .

[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix server"

[deploy]
startCommand = "npm start --prefix server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
